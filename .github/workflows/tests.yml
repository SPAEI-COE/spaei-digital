name: Testes de Regressão

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regressao:
    name: Suite de regressão (app real + mock RTDB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências (jsdom)
        run: npm install

      - name: Rodar suite de regressão
        run: npm test

  regras-rtdb:
    name: database.rules.json contra o emulador RTDB real
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java (exigido pelo emulador RTDB)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar firebase-tools e @firebase/rules-unit-testing
        run: |
          npm install -g firebase-tools
          npm install --no-save @firebase/rules-unit-testing

      - name: Copiar database.rules.json pro path esperado pelo --config
        run: cp database.rules.json tests/rules/database.rules.json

      - name: Rodar teste de regras contra o emulador
        run: firebase emulators:exec --config tests/rules/firebase.test.json --project spaei-digital-coe-teste "node tests/rules/rules.test.js"
